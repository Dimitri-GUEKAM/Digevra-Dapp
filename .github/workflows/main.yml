name: Deploy DIGEVRA DApp

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check tests
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Test Angular Wallet
        run: npm test -- --watch=false

      - name: Test Explorer
        run: npm run test:explorer

      - name: Test blockchain indexer
        run: npm run test:indexer

      - name: Build Wallet and prepare Pages artifact
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify published application files
        run: |
          test -f dist/dapp-frontend/browser/index.html
          test -f dist/dapp-frontend/browser/digevra-config.js
          test -f dist/dapp-frontend/browser/explorer/index.html
          test -f dist/dapp-frontend/browser/explorer/explorer.js

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/dapp-frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
